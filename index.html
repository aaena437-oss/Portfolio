<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qura Tul Ain — Web Developer Portfolio</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Anton&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0e0d0c;
      --bg-card: #161514;
      --text-cream: #e8e1d5;
      --text-muted: #8c857b;
      --accent-rose: #a35d61;
      --border-line: rgba(232, 225, 213, 0.14);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-cream);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* Hero Section */
    .hero {
      position: relative;
      padding-bottom: 4rem;
      border-bottom: 1px solid var(--border-line);
    }

    .hero-title-wrapper {
      position: relative;
      text-align: center;
      margin-bottom: 2rem;
    }

    .hero-mega-title {
      font-family: 'Anton', sans-serif;
      font-size: clamp(4.5rem, 18vw, 15rem);
      line-height: 0.85;
      letter-spacing: 0.02em;
      color: var(--text-cream);
      text-transform: uppercase;
      user-select: none;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      align-items: end;
      gap: 2rem;
      margin-top: -4.5vw;
      position: relative;
      z-index: 2;
    }

    .hero-left h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 1.35rem;
      line-height: 1.3;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.65rem 1.3rem;
      border: 1px solid var(--border-line);
      border-radius: 50px;
      color: var(--text-cream);
      text-decoration: none;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .pill-btn:hover {
      border-color: var(--accent-rose);
      background: rgba(163, 93, 97, 0.15);
    }

    .sparkle {
      color: var(--text-cream);
      font-size: 0.9rem;
    }

    .signature {
      font-family: 'Great Vibes', cursive;
      font-size: 2.3rem;
      color: var(--accent-rose);
      margin-top: 2.2rem;
      opacity: 0.9;
    }

    /* Center Portrait Frame */
    .hero-center {
      display: flex;
      justify-content: center;
    }

    .portrait-box {
      width: 100%;
      max-width: 340px;
      height: 410px;
      background: linear-gradient(180deg, #24211e 0%, #0e0d0c 100%);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border-line);
    }

    .portrait-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(1.05) brightness(0.92);
    }

    .hero-right {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: space-between;
      height: 100%;
    }

    .hero-bio {
      font-size: 0.85rem;
      color: var(--text-muted);
      max-width: 260px;
      text-align: left;
      margin-bottom: 3rem;
    }

    .location-badge {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: right;
    }

    .globe-icon {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border-line);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1rem;
    }

    /* Section Headers */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2.5rem 0 1.8rem;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-cream);
    }

    .section-header a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.3s;
    }

    .section-header a:hover {
      color: var(--text-cream);
    }

    /* Selected Projects */
    .projects-section {
      padding-bottom: 4rem;
      border-bottom: 1px solid var(--border-line);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }

    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border-line);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .project-card:hover {
      transform: translateY(-4px);
      border-color: rgba(232, 225, 213, 0.35);
    }

    .project-meta {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      margin-bottom: 1.2rem;
    }

    .project-num {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .project-title {
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .project-sub {
      display: block;
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: none;
      letter-spacing: 0.02em;
      font-weight: 400;
    }

    .project-mockup {
      height: 210px;
      border-radius: 3px;
      margin-bottom: 1.2rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
      overflow: hidden;
    }

    .mockup-1 {
      background: linear-gradient(135deg, #2b1316 0%, #140b0c 100%);
    }

    .mockup-2 {
      background: linear-gradient(135deg, #241f18 0%, #12100d 100%);
    }

    .mockup-3 {
      background: linear-gradient(135deg, #2a241e 0%, #151310 100%);
      text-align: center;
    }

    .project-mockup h4 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 1.25rem;
      line-height: 1.25;
      color: var(--text-cream);
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .tag {
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.3rem 0.6rem;
      border: 1px solid var(--border-line);
      color: var(--text-muted);
    }

    /* Split Section: Process & Tools */
    .split-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border-line);
    }

    .process-col {
      padding: 3rem 2.5rem 3rem 0;
      border-right: 1px solid var(--border-line);
    }

    .tools-col {
      padding: 3rem 0 3rem 2.5rem;
    }

    .col-heading {
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .process-layout {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 1.5rem;
      align-items: end;
    }

    .process-list {
      list-style: none;
    }

    .process-item {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.2rem;
    }

    .process-num {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--text-muted);
      min-width: 24px;
    }

    .process-info h4 {
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }

    .process-info p {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .process-quote {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      line-height: 1.4;
      color: var(--text-muted);
      border-left: 1px solid var(--border-line);
      padding-left: 1rem;
    }

    /* Tools Grid */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.9rem;
    }

    .tool-box {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.85rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border-line);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .tool-icon {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border-line);
      display: grid;
      place-items: center;
      font-weight: 600;
      font-size: 0.75rem;
      color: var(--text-cream);
    }

    .more-tools {
      margin-top: 1.2rem;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* Testimonials (Kind Words) */
    .testimonials-section {
      padding: 3rem 0 4rem;
      border-bottom: 1px solid var(--border-line);
    }

    .testimonials-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
    }

    .testimonial-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
